name: Test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: JavaScript calculation tests
        run: node --test tests/core-calculation.test.js

      - name: Python, API, provider, and browser tests
        run: pytest -q


  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t rental-analyzer-ci .
      - name: Verify packaged data and configurable HTTP port
        run: |
          docker run --rm rental-analyzer-ci python -c "from providers import appreciation; assert appreciation.is_available()"
          docker run --detach --rm --name rental-analyzer-smoke -e PORT=8080 -p 127.0.0.1:18080:8080 rental-analyzer-ci
          trap 'docker logs rental-analyzer-smoke; docker stop rental-analyzer-smoke' EXIT
          curl --fail --retry 25 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/ -o /tmp/analyzer.html
          curl --fail http://127.0.0.1:18080/static/js/app.js -o /dev/null
          curl --fail http://127.0.0.1:18080/static/js/deal-engine.js -o /dev/null
          curl --fail http://127.0.0.1:18080/static/js/navigation.js -o /dev/null
          curl --fail http://127.0.0.1:18080/static/css/app.css -o /dev/null
